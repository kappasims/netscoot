# Supplementary security scan: runs PSScriptAnalyzer's security rules over the whole repository and
# uploads SARIF to the Security tab. The gating lint (full PSScriptAnalyzer via build.ps1) lives in
# ci.yml. This job is named distinctly so it does not collide with that required "PSScriptAnalyzer" check.
name: PowerShell security scan

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '40 10 * * 3'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install PSScriptAnalyzer + ConvertToSARIF with retries (a transient PowerShell Gallery failure
      # would otherwise fail the scheduled scan), run the security rules over the repository root, emit SARIF.
      - name: Run PSScriptAnalyzer (security rules) -> SARIF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Install-ModuleWithRetry([string]$Name, [string]$RequiredVersion) {
            $p = @{ Name = $Name; Scope = 'CurrentUser'; Force = $true; AllowClobber = $true; Repository = 'PSGallery'; ErrorAction = 'Stop' }
            if ($RequiredVersion) { $p['RequiredVersion'] = $RequiredVersion }
            for ($i = 1; $i -le 5; $i++) {
              try {
                Install-Module @p
                return
              } catch {
                Write-Host "::warning::Install of $Name failed (attempt $i/5): $($_.Exception.Message)"
                if ($i -eq 5) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          # Pinned to the same PSScriptAnalyzer as the gating lint in ci.yml.
          Install-ModuleWithRetry -Name PSScriptAnalyzer -RequiredVersion '1.25.0'
          Install-ModuleWithRetry -Name ConvertToSARIF
          Import-Module PSScriptAnalyzer
          Import-Module ConvertToSARIF
          $rules = @('PSAvoidGlobalAliases', 'PSAvoidUsingConvertToSecureStringWithPlainText')
          Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule $rules |
            ConvertTo-SARIF -FilePath results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
