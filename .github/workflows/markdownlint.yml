name: Markdownlint

# Enforce DavidAnson/markdownlint on all Markdown (README + skills + docs). Config in
# .markdownlint.jsonc tunes only MD013/MD024/MD033 to the generated reference's shape, and the rest
# are defaults. The repository has no other Node tooling, so this job sets up Node and runs the CLI.
# Push runs only on the long-lived branches. A PR from an in-repository branch already triggers on
# pull_request, so this avoids linting the same commit twice.
on:
  push:
    branches: [develop, master, '*-beta']
  pull_request:

concurrency:
  group: markdownlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
