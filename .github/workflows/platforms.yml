name: Platforms (manual)

# Ad-hoc Linux and macOS run for any branch, via tools/Invoke-PlatformCI.ps1 or the Actions tab.
# Release commits get the same matrix automatically from ci.yml's test-platforms job.
on:
  workflow_dispatch:

# Read-only: this workflow only checks out and runs tests, never writes back to the repository.
permissions:
  contents: read
  packages: read

jobs:
  test:
    # Sharded per OS (separate processes), matching ci.yml: the suite shares process-global state so
    # it parallelizes across jobs, not in-process.
    name: Test (${{ matrix.os }}) [${{ matrix.shard }}/3]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Ubuntu/macOS runners ship pwsh; build.ps1 no longer auto-installs Pester. Provision it
      # (pinned), retrying so a transient PSGallery/NuGet hiccup does not fail the gate.
      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 3; $i++) {
            try { Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck; break }
            catch { if ($i -eq 3) { throw }; Write-Host "Install-Module Pester failed (attempt $i); retrying in 10s..."; Start-Sleep 10 }
          }

      - name: Run tests
        shell: pwsh
        run: ./build.ps1 -Task Test -ShardIndex ${{ matrix.shard }} -ShardCount 3
